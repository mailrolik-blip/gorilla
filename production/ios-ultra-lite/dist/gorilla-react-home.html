<style id="gorilla-webview-lite">
@supports (content-visibility: auto) {
  .homepage-school-shell > .relative > section,
  .homepage-school-shell > .relative > div {
    content-visibility: auto;
    contain-intrinsic-size: auto 900px;
  }

  .homepage-school-shell #hero {
    content-visibility: visible;
  }
}
</style>

<body class="flex min-h-full flex-col bg-[color:var(--gh-bg)]">
<div id="gorilla-react-root"></div>


<script>
(function () {
  var armed = false;
  var reloading = false;

  function forceFresh(reason) {
    if (reloading) return;
    reloading = true;

    var url = new URL(window.location.href);

    url.searchParams.set(
      '_fresh',
      Date.now().toString() + '-' + Math.random().toString(36).slice(2)
    );

    window.location.replace(url.pathname + url.search + url.hash);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      armed = true;
      return;
    }

    if (document.visibilityState === 'visible' && armed) {
      forceFresh('visibility');
    }
  });

  window.addEventListener('pagehide', function () {
    armed = true;
  });

  window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
      forceFresh('pageshow-bfcache');
    }
  });

  window.addEventListener('focus', function () {
    if (armed) {
      forceFresh('focus');
    }
  });
})();
</script>

<script src="/gorilla-react-home.js" defer></script>
</body>
