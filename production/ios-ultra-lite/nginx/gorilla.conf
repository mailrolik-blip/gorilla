server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gorillahockey.ru;

    client_max_body_size 20M;


    # Stable public entry for Telegram/iOS
    location = /go {
        root /var/www/html;
        rewrite ^/go$ /gorilla-react-home.html break;

        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Frontend "ios-ultra-lite" always;
    }

    # FINAL PUBLIC HOMEPAGE:
    # React 18 ultra-lite directly on /
    location = / {
        root /var/www/html;
        rewrite ^/$ /gorilla-react-home.html break;

        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Frontend "ios-ultra-lite" always;
    }

    # Actual standalone React homepage.
    location ^~ /open/ {
        root /var/www/html;
        rewrite ^/open/.*$ /gorilla-react-home.html break;

        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Frontend "react18-standalone" always;
    }


    # Прямой статический тест без Next.js
    location = /gorilla-test.html {
        root /var/www/html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }


    # Диагностика Telegram iOS: полностью запрещаем кэш Next test
    location = /next-test {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";

        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Test "nocache-v2" always;
    }


    # Gorilla static-safe homepage: без Next/React JS
    location = /gorilla-safe.html {
        root /var/www/html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Render "static-safe" always;
    }


    location = /gorilla-js-test.html {
        root /var/www/html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Test "vanilla-js" always;
    }


    location = /public-v2.html {
        root /var/www/html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Render "public-v2" always;
    }

    location = /gorilla-public-v2.js {
        root /var/www/html;
        default_type application/javascript;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }


    # Полный существующий Next-сайт, но не как корневой документ WebView
    location = /__gorilla_app {
        proxy_pass http://127.0.0.1:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Тест новой входной оболочки
    location = /shell-test {
        alias /var/www/html/gorilla-shell.html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Shell "v1" always;
    }


    # Isolated Next 14 / React 18 compatibility test
    location = /next14-test {
        alias /var/www/html/next14-test/index.html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Compat "next14-react18" always;
    }

    location ^~ /next14-test/ {
        root /var/www/html;

        try_files $uri =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Compat "next14-react18" always;
    }


    location = /next14-test.html {
        alias /var/www/html/next14-test/index.html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Compat "next14-react18" always;
    }


    location = /react18-test.html {
        alias /var/www/html/react18-test.html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Test "react18-standalone" always;
    }

    location = /react18-test.js {
        alias /var/www/html/react18-test.js;
        default_type application/javascript;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }


    # Existing Gorilla homepage, React 18 standalone, no Next client runtime
    location = /react-home-test.html {
        alias /var/www/html/gorilla-react-home.html;
        default_type text/html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Gorilla-Frontend "react18-standalone" always;
    }

    location = /gorilla-react-home.js {
        alias /var/www/html/gorilla-react-home.js;
        default_type application/javascript;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ^~ /gorilla-assets/ {
        root /var/www/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Остальной Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    ssl_certificate /etc/letsencrypt/live/gorillahockey.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gorillahockey.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www всегда переводим на основной домен
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.gorillahockey.ru;

    return 301 https://gorillahockey.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/gorillahockey.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gorillahockey.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS на основной домен
server {
    listen 80;
    listen [::]:80;

    server_name gorillahockey.ru www.gorillahockey.ru;

    return 301 https://gorillahockey.ru$request_uri;
}
